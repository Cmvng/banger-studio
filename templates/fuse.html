<script>
(function(){
  const $ = id => document.getElementById(id);
  let BW_SESSION = '';
  try {
    BW_SESSION = sessionStorage.getItem('banger_session') || ('bw_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2));
    sessionStorage.setItem('banger_session', BW_SESSION);
  } catch(e) {
    BW_SESSION = 'bw_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2);
  }
  const NL = String.fromCharCode(10);
  function E(x){return (window.esc?esc(x):String(x==null?'':x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])));}
  window.__bwHasBrief=false; window.__bwStore={}; let shots=[];
  function addShots(files){
    [].slice.call(files,0,3-shots.length).forEach(function(f){
      var rd=new FileReader();
      rd.onload=function(){ var im=new Image(); im.onload=function(){
        var s=Math.min(1,1100/im.width);
        var c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        shots.push(c.toDataURL('image/jpeg',0.82)); drawThumbs();
      }; im.src=rd.result; };
      rd.readAsDataURL(f);
    });
  }
  function drawThumbs(){ var t=$('bw_thumbs'); if(!t)return;
    t.innerHTML=shots.map(function(s,i){return '<div class="bw-th"><img src="'+s+'"><button type="button" class="bw-thx" data-i="'+i+'">&times;</button></div>';}).join('');
  }
  const TYPE_OPTS=[['deepdive','deep-dive'],['alpha','alpha / call'],['update','update'],['airdrop','airdrop / how-to'],['educational','educational'],['banger','banger'],['viral','viral'],['article','article']];
  const N_OPTS=[['2','2'],['1','1'],['3','3']];
  function ddHTML(id,opts,val){
    var cur=opts.find(function(o){return o[0]===val;})||opts[0];
    var items=opts.map(function(o){return '<div class="bw-ddo'+(o[0]===val?' sel':'')+'" data-v="'+E(o[0])+'">'+E(o[1])+'</div>';}).join('');
    return '<div class="bw-dd" id="'+id+'"><button type="button" class="bw-ddbtn" data-v="'+E(cur[0])+'">'+E(cur[1])+'<span class="bw-ddcar">&#9662;</span></button><div class="bw-ddlist">'+items+'</div></div>';
  }

  function styles(){
    if($('bw_style'))return;
    const s=document.createElement('style'); s.id='bw_style';
    s.textContent=''
    +'.bw-wrap{padding:4px 2px 48px}'
    +'.bw-card{background:#fff;border:1px solid #dce6f5;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 12px 30px -14px rgba(18,58,158,.20)}'
    +'.bw-lab{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#5D7BB8;margin:2px 0 7px}'
    +'.bw-in,.bw-sel{width:100%;background:#F4F8FF;border:1px solid #cddaf0;border-radius:10px;color:#0B1B3A;padding:12px;font-size:15px;margin-bottom:12px;box-sizing:border-box}'
    +'textarea.bw-in{min-height:76px;resize:vertical;line-height:1.45}'
    +'.bw-btn{width:100%;background:linear-gradient(180deg,#2E6BFF,#123A9E);color:#fff;border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:800;cursor:pointer}'
    +'.bw-btn2{width:100%;background:#EEF3FD;color:#20386A;border:1px solid #cddaf0;border-radius:11px;padding:11px;font-size:13.5px;font-weight:700;cursor:pointer;margin-bottom:12px}'
    +'.bw-row{display:flex;gap:10px}.bw-row>div{flex:1}'
    +'.bw-ok{color:#1B7A46;font-size:13px;font-weight:700}'
    +'.bw-sec{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#5D7BB8;margin:16px 0 8px}'
    +'.bw-post{background:#F4F8FF;border:1px solid #d6e2f5;border-radius:12px;padding:14px;white-space:pre-wrap;font-size:14px;line-height:1.55;color:#10254A}'
    +'.bw-lens{font-weight:800;color:#123A9E;font-size:13px;margin-bottom:7px}'
    +'.bw-fix{font-size:11px;color:#6C82AB;margin-top:9px;line-height:1.4}'
    +'.bw-fix b{color:#42588A}'
    +'.bw-facts{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}'
    +'.bw-f{background:#F4F8FF;border:1px solid #d6e2f5;border-radius:9px;padding:7px 10px;font-size:12px;color:#22375f}'
    +'.bw-f b{display:block;font-size:9px;color:#7E93C4;text-transform:uppercase;letter-spacing:.1em}'
    +'.bw-tags{margin-top:11px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}'
    +'.bw-tag{border-radius:99px;padding:4px 11px;font-size:11px;font-weight:700}'
    +'.bw-slopok{background:#E4F7EC;color:#1B7A46}.bw-slopbad{background:#FDECEF;color:#B23A54}'
    +'.bw-tpl{background:#E3ECFF;color:#20386A}'
    +'.bw-fill{background:#123A9E;color:#fff;border:0;border-radius:99px;padding:9px 18px;font-size:12.5px;font-weight:800;cursor:pointer;margin-left:auto}'
    +'.bw-copy{background:#EEF3FD;color:#20386A;border:1px solid #cddaf0;border-radius:99px;padding:8px 16px;font-size:12.5px;font-weight:800;cursor:pointer}'
    +'#bw_back{position:fixed;left:14px;bottom:14px;z-index:9999;background:#fff;color:#123A9E;border:1px solid #cddaf0;border-radius:99px;padding:11px 18px;font-size:13px;font-weight:800;box-shadow:0 12px 30px -12px rgba(18,58,158,.35);cursor:pointer}'
    +'.bw-warn{background:#FDECEF;border:1px solid #F3B6C2;color:#B23A54;border-radius:12px;padding:12px;font-size:13px}'
    +'.bw-dd{position:relative}'
    +'.bw-ddbtn{width:100%;text-align:left;background:#F4F8FF;border:1px solid #cddaf0;border-radius:10px;color:#0B1B3A;padding:12px;font-size:15px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-family:inherit}'
    +'.bw-ddcar{color:#5D7BB8;font-size:12px;margin-left:8px}'
    +'.bw-ddlist{display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid #cddaf0;border-radius:12px;box-shadow:0 18px 40px -12px rgba(18,58,158,.28);z-index:60;overflow:hidden;max-height:340px;overflow-y:auto}'
    +'.bw-dd.open .bw-ddlist{display:block}'
    +'.bw-ddo{padding:13px 14px;font-size:15px;color:#20386A;cursor:pointer;border-bottom:1px solid #eef3fd}'
    +'.bw-ddo:last-child{border-bottom:0}'
    +'.bw-ddo.sel{background:#EEF3FD;font-weight:800;color:#123A9E}'
    +'.bw-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}'
    +'.bw-th{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid #cddaf0;background:#F4F8FF}'
    +'.bw-th img{width:100%;height:100%;object-fit:cover;display:block}'
    +'.bw-thx{position:absolute;top:2px;right:2px;background:#123A9E;color:#fff;border:0;border-radius:99px;width:20px;height:20px;font-size:12px;line-height:1;cursor:pointer;padding:0}'
    +'.bw-needcard{border-color:#F0DCA0!important}'
    +'.bw-needh{font-weight:800;color:#8A6D1F;font-size:14.5px;margin-bottom:6px}'
    +'.bw-needb{font-size:13px;color:#5C4A18;margin-bottom:9px}'
    +'.bw-edit{background:#EEF3FD;color:#20386A;border:1px solid #cddaf0;border-radius:99px;padding:8px 16px;font-size:12.5px;font-weight:800;cursor:pointer}'
    +'.bw-editbox{margin-top:11px;background:#F4F8FF;border:1px solid #cddaf0;border-radius:12px;padding:12px}'
    +'.bw-editbox textarea{width:100%;box-sizing:border-box;min-height:90px;background:#fff;border:1px solid #cddaf0;border-radius:10px;padding:11px;font-size:14px;line-height:1.5;color:#10254A;resize:vertical;margin-bottom:9px}'
    +'.bw-editrow{display:flex;gap:9px}'
    +'.bw-editsave{flex:1;background:linear-gradient(180deg,#2E6BFF,#123A9E);color:#fff;border:0;border-radius:10px;padding:11px;font-size:13px;font-weight:800;cursor:pointer}'
    +'.bw-editcancel{background:#fff;color:#5D7BB8;border:1px solid #cddaf0;border-radius:10px;padding:11px 16px;font-size:13px;font-weight:700;cursor:pointer}'
    +'.bw-editnote{font-size:10.5px;color:#7E93C4;margin-top:8px;line-height:1.4}'
    +'.bw-lesson{background:#E4F7EC;border:1px solid #b9e6cb;color:#1B7A46;border-radius:10px;padding:10px 12px;font-size:12.5px;margin-top:9px}'
    +'.bw-mut{font-size:11px;color:#8CA3CC;margin-top:7px}';
    document.head.appendChild(s);
  }

  function panelHTML(){
    return '<div class="bw-wrap">'
     +'<div class="bw-card">'
     +'<div class="bw-lab">optional · pull real facts first</div>'
     +'<div class="bw-row"><div><input id="bw_proj" class="bw-in" placeholder="project e.g. Wallchain" style="margin-bottom:0"></div>'
     +'<div style="max-width:120px"><input id="bw_root" class="bw-in" placeholder="link" style="margin-bottom:0"></div></div>'
     +'<div style="height:10px"></div>'
     +'<button id="bw_gather" class="bw-btn2">pull facts (free)</button>'
     +'<div id="bw_facts"></div>'
     +'<div class="bw-lab">what\'s it about</div>'
     +'<textarea id="bw_topic" class="bw-in" placeholder="topic or paste facts... e.g. rank 13 on wallchain, 7.53 quacks yesterday, quacks convert at TGE"></textarea>'
     +'<button id="bw_shotbtn" class="bw-btn2" type="button">+ attach screenshot(s) of content to rewrite</button>'
     +'<input id="bw_shotfile" type="file" accept="image/*" multiple style="display:none">'
     +'<div id="bw_thumbs" class="bw-thumbs"></div>'
     +'<div class="bw-row">'
     +'<div><div class="bw-lab">type</div>'+ddHTML('bw_type_dd',TYPE_OPTS,'deepdive')+'</div>'
     +'<div style="max-width:104px"><div class="bw-lab">versions</div>'+ddHTML('bw_n_dd',N_OPTS,'2')+'</div>'
     +'</div>'
     +'<button id="bw_go" class="bw-btn">write + design it (fires api · cents)</button>'
     +'<div class="bw-mut">runs the critique loop, then fills your real template. the api only fires on this button.</div>'
     +'</div>'
     +'<div id="bw_out"></div></div>';
  }

  async function gather(){
    const proj=$('bw_proj').value, root=$('bw_root').value;
    if(!proj){ return; }
    $('bw_facts').innerHTML='<div class="bw-mut">gathering… opening the site, pulling numbers, reading X…</div>';
    try{
      const r=await fetch('/gather',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({proj:proj,root:root,session:BW_SESSION})});
      const j=await r.json(); const b=j.brief||{}; window.__bwHasBrief=true;
      const facts=Object.keys(b.live_numbers||{}).map(k=>'<div class="bw-f"><b>'+E(k)+'</b>'+E(b.live_numbers[k])+'</div>').join('')||'<div class="bw-mut">no live numbers found — type facts above.</div>';
      $('bw_facts').innerHTML='<div class="bw-ok" style="margin:2px 0 6px">✓ facts pulled · $0.00 · will be used in the write</div><div class="bw-facts">'+facts+'</div>';
    }catch(e){ $('bw_facts').innerHTML='<div class="bw-warn">could not gather. type facts above instead.</div>'; }
  }

  async function compose(){
    const topic=$('bw_topic').value.trim();
    const tb=document.querySelector('#bw_type_dd .bw-ddbtn'), nb=document.querySelector('#bw_n_dd .bw-ddbtn');
    const type=tb?tb.getAttribute('data-v'):'deepdive', n=+((nb&&nb.getAttribute('data-v'))||2);
    if(!topic && !shots.length){ $('bw_out').innerHTML='<div class="bw-card"><div class="bw-warn">type what it\'s about, or attach a screenshot of the content.</div></div>'; return; }
    const um=topic.match(/https?:\/\/[^\s]+/);
    if(um && !window.__bwHasBrief){
      $('bw_out').innerHTML='<div class="bw-card"><div class="bw-mut">found a link in your topic &mdash; pulling its facts first (free)&hellip;</div></div>';
      try{
        var u=new URL(um[0]);
        var seg=u.pathname.split('/').filter(Boolean)[0]||'';
        var pj=$('bw_proj').value.trim()||seg||u.hostname.replace('www.','').split('.')[0];
        var rr=await fetch('/gather',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({proj:pj,root:um[0],session:BW_SESSION})});
        await rr.json(); window.__bwHasBrief=true;
      }catch(e){}
    }
    $('bw_out').innerHTML='<div class="bw-card"><div class="bw-mut">'+(shots.length?'reading your screenshot(s), then rewriting through the loop…':'writing '+n+' version(s) through the loop, then designing…')+'</div></div>';
    try{
      const r=await fetch('/compose',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:topic,type:type,n:n,usebrief:window.__bwHasBrief,images:shots,session:BW_SESSION})});
      const res=await r.json(); renderVersions(res);
    }catch(e){ $('bw_out').innerHTML='<div class="bw-card"><div class="bw-warn">write failed. try again.</div></div>'; }
  }

  function renderVersions(res){
    if(res.error==='need_facts'){ $('bw_out').innerHTML='<div class="bw-card bw-needcard">'
      +'<div class="bw-needh">the writer won\'t make things up</div>'
      +'<div class="bw-needb">it needs real facts on this first — so it never hallucinates:</div>'
      +'<div class="bw-post" style="background:#FFF9EC;border-color:#F0E0B8;color:#5C4A18">'+E(res.message||'')+'</div>'
      +'<div class="bw-mut">&#8594; put the project\'s real link up top and hit <b>pull facts</b>, or paste specifics into the box, then write again.</div></div>'; return; }
    if(res.error){ $('bw_out').innerHTML='<div class="bw-card"><div class="bw-warn">'+E(res.error)+'<br><br>'+E(res.message||'')+'</div></div>'; return; }
    const vs=res.versions||[]; if(!vs.length){ $('bw_out').innerHTML='<div class="bw-card"><div class="bw-warn">no versions came back.</div></div>'; return; }
    window.__bwStore={};
    let out='<div class="bw-card"><div class="bw-ok">✓ '+vs.length+' version(s) · '+E(res.type_label||'')+' · run $'+E(res.run_cost_usd)+' · month $'+E(res.month_spent_usd)+'</div>'
      +(res.source?'<div class="bw-mut" style="margin-top:6px"><b>receipts it read:</b> '+E(res.source)+'</div>':'')+'</div>';
    vs.forEach(function(v,i){
      const id='v'+i; window.__bwStore[id]=v;
      const slop=v.slop||[], inv=v.invented||[], fab=v.fab||[];
      const slopTag=slop.length?'<span class="bw-tag bw-slopbad">&#9888; slop: '+E(slop.join(', '))+'</span>':'<span class="bw-tag bw-slopok">&#10003; clean</span>';
      const invTag=inv.length?'<span class="bw-tag bw-slopbad">&#9888; numbers not in the source: '+E(inv.slice(0,4).join(', '))+'</span>':'';
      const fabTag=fab.length?'<span class="bw-tag bw-slopbad">&#9888; fabricated experience: "'+E(fab.join('", "'))+'" — he never lived this</span>':'';
      const fixedTag=v.fixed?'<span class="bw-tag" style="background:#E4F7EC;color:#1B7A46">&#10003; '+E(v.fixnote||'self-corrected')+'</span>':'';
      const fix=v.critique?'<div class="bw-fix"><b>loop fixed:</b> '+E(v.critique)+'</div>':'';
      out+='<div class="bw-card">'
        +'<div class="bw-lens">'+E(v.lens||('version '+(i+1)))+'</div>'
        +'<div class="bw-post">'+E(v.draft||'')+'</div>'
        +fix
        +'<div class="bw-tags"><span class="bw-tag bw-tpl">'+E(v.template||'&mdash;')+'</span>'+fixedTag+slopTag+invTag+fabTag
        +'<button class="bw-copy" data-id="'+id+'">copy</button>'
        +'<button class="bw-edit" data-id="'+id+'">&#9998; my edit</button>'
        +'<button class="bw-fill" onclick="__bwFill(\''+id+'\')">fill the '+E(v.template||'template')+' &#8594;</button></div>'
        +'<div class="bw-editslot" data-slot="'+id+'"></div>'
        +'</div>';
    });
    $('bw_out').innerHTML=out;
  }

  function fallbackCopy(t){ var ta=document.createElement('textarea'); ta.value=t; ta.style.cssText='position:fixed;left:-999px'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} ta.remove(); }

  window.__bwFill=function(id){
    const v=(window.__bwStore||{})[id]; if(!v)return;
    const tpl=(v.template&&T[v.template])?v.template:'quote';
    openT(tpl);
    const slots=v.slots||{};
    const ids=(T[tpl].slots||[]).map(function(s){return s.id;});
    Object.keys(slots).forEach(function(k){ if(ids.indexOf(k)>=0){ try{ setV(k, String(slots[k])); }catch(e){} } });
    // fallback: if nothing matched, put first line into first text slot
    var matched=Object.keys(slots).some(function(k){return ids.indexOf(k)>=0;});
    if(!matched){ var line=(v.draft||'').split(NL).find(function(x){return x.trim();})||''; var ts=(T[tpl].slots||[]).filter(function(s){return s.t==='text';}); if(ts[0])setV(ts[0].id,line.slice(0,90)); }
    // bring the editor forward
    var ws=$('wscr'); if(ws)ws.classList.remove('on');
    document.body.classList.remove('bmode');
    document.querySelectorAll('.screen').forEach(function(x){x.classList.remove('on');});
    var ed=$('editor'); if(ed)ed.classList.add('on');
    if(ed && !document.getElementById('bw_back')){
      var bp=document.createElement('button'); bp.id='bw_back'; bp.type='button';
      bp.innerHTML='&#8592; back to drafts';
      bp.onclick=function(){ if(typeof goWriter==='function') goWriter(); };
      ed.appendChild(bp);
    }
    window.scrollTo(0,0);
  };

  function mountIntoWriter(){
    const ws=$('wscr'); if(!ws)return;
    const body=ws.querySelector('.wbody'); if(!body||body.dataset.bw)return;
    styles(); body.dataset.bw='1'; body.innerHTML=panelHTML();
    $('bw_gather').onclick=gather; $('bw_go').onclick=compose;
    $('bw_shotbtn').onclick=function(){$('bw_shotfile').click();};
    $('bw_shotfile').onchange=function(e){addShots(e.target.files); e.target.value='';};
    drawThumbs();
  }
  if(typeof window.goWriter==='function'){
    const orig=window.goWriter;
    window.goWriter=function(){ orig(); setTimeout(mountIntoWriter,30); };
  }
  function editBoxHTML(id, txt){
    return '<div class="bw-editbox">'
      +'<textarea id="bw_edittxt_'+id+'">'+E(txt)+'</textarea>'
      +'<div class="bw-editrow"><button class="bw-editsave" data-id="'+id+'">save & learn</button>'
      +'<button class="bw-editcancel" data-id="'+id+'">cancel</button></div>'
      +'<div class="bw-editnote">what you post is the real answer. this teaches the writer to stop making the mistake you just fixed \u2014 it does not overwrite your draft above.</div>'
      +'</div>';
  }

  async function saveEdit(id){
    var slot=document.querySelector('.bw-editslot[data-slot="'+id+'"]'); if(!slot)return;
    var ta=$('bw_edittxt_'+id); if(!ta)return;
    var v=(window.__bwStore||{})[id]; var original=v?(v.draft||''):'';
    var edited=ta.value;
    var btn=slot.querySelector('.bw-editsave'); if(btn){ btn.textContent='learning\u2026'; btn.disabled=true; }
    try{
      var r=await fetch('/learn',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({original:original,edited:edited})});
      var j=await r.json();
      if(j.error){ slot.innerHTML='<div class="bw-editnote">'+E(j.message||'nothing to learn.')+'</div>'; return; }
      slot.innerHTML='<div class="bw-lesson">&#10003; learned: '+E(j.lesson||'saved')+'</div>';
    }catch(e){ slot.innerHTML='<div class="bw-warn">could not save the edit. try again.</div>'; }
  }

  document.addEventListener('click',function(e){
    var ed=e.target.closest?e.target.closest('.bw-edit'):null;
    if(ed){ var id=ed.getAttribute('data-id'); var slot=document.querySelector('.bw-editslot[data-slot="'+id+'"]');
      if(slot){ var v=(window.__bwStore||{})[id]; var txt=v?(v.draft||''):'';
        slot.innerHTML = slot.innerHTML ? '' : editBoxHTML(id, txt); }
      e.stopPropagation(); return; }
    var es=e.target.closest?e.target.closest('.bw-editsave'):null;
    if(es){ saveEdit(es.getAttribute('data-id')); e.stopPropagation(); return; }
    var ec=e.target.closest?e.target.closest('.bw-editcancel'):null;
    if(ec){ var id2=ec.getAttribute('data-id'); var slot2=document.querySelector('.bw-editslot[data-slot="'+id2+'"]'); if(slot2)slot2.innerHTML=''; e.stopPropagation(); return; }
    var cp=e.target.closest?e.target.closest('.bw-copy'):null;
    if(cp){ var v=(window.__bwStore||{})[cp.getAttribute('data-id')]; var txt=v?(v.draft||''):'';
      var done=function(){ cp.textContent='copied \u2713'; setTimeout(function(){cp.textContent='copy';},1400); };
      if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done,function(){ fallbackCopy(txt); done(); }); }
      else { fallbackCopy(txt); done(); }
      e.stopPropagation(); return; }
    var tx=e.target.closest?e.target.closest('.bw-thx'):null;
    if(tx){ shots.splice(+tx.getAttribute('data-i'),1); drawThumbs(); e.stopPropagation(); return; }
    var opt=e.target.closest?e.target.closest('.bw-ddo'):null;
    if(opt){ var dd=opt.closest('.bw-dd'), b=dd.querySelector('.bw-ddbtn'); b.innerHTML=E(opt.textContent.trim())+'<span class="bw-ddcar">&#9662;</span>'; b.setAttribute('data-v',opt.getAttribute('data-v')); dd.querySelectorAll('.bw-ddo').forEach(function(x){x.classList.remove('sel');}); opt.classList.add('sel'); dd.classList.remove('open'); e.stopPropagation(); return; }
    var btn=e.target.closest?e.target.closest('.bw-ddbtn'):null;
    if(btn){ var d2=btn.closest('.bw-dd'), was=d2.classList.contains('open'); document.querySelectorAll('.bw-dd.open').forEach(function(x){x.classList.remove('open');}); if(!was)d2.classList.add('open'); e.stopPropagation(); return; }
    document.querySelectorAll('.bw-dd.open').forEach(function(x){x.classList.remove('open');});
  });
  document.addEventListener('DOMContentLoaded',function(){ setTimeout(function(){ if($('wscr')&&$('wscr').classList.contains('on'))mountIntoWriter(); },200); });
})();
</script>
<script>
(function () {
  'use strict';

    if(kind==='text'||kind==='textStructure'||kind==='textStructures') {
      const item=findById(textStructures,id); return item ? item.build([f.id,f.w,f.h],t).map(safeClone) : [];
    }
    if(kind==='layout'||kind==='specialLayout'||kind==='specialLayouts') {
      const item=findById(specialLayouts,id); return item ? item.build([f.id,f.w,f.h],t).map(safeClone) : [];

<script>
(function (root) {
  'use strict';

  const FORMATS = {
    post: [1080, 1350],
    square: [1080, 1080],
    wide: [1920, 1080],
    story: [1080, 1920]
  };

  const number = (value, fallback) => Number.isFinite(+value) ? +value : fallback;
  const round = value => Math.round(value * 1000) / 1000;

  function format(raw) {
    if (Array.isArray(raw)) {
      return {id:String(raw[0] || 'custom'), w:number(raw[1], 1080), h:number(raw[2], 1350)};
    }
    if (typeof raw === 'string' && FORMATS[raw]) {
      return {id:raw, w:FORMATS[raw][0], h:FORMATS[raw][1]};
    }
    if (raw && typeof raw === 'object') {
      return {id:String(raw.id || 'custom'), w:number(raw.w || raw.width, 1080), h:number(raw.h || raw.height, 1350)};
    }
    return {id:'post', w:1080, h:1350};
  }

  function textHeight(layer) {
    const size = Math.max(1, number(layer.size, 60));
    const width = Math.max(24, number(layer.w, 200));
    const lineHeight = Math.max(.65, number(layer.lh, 1.08));
    const charactersPerLine = Math.max(1, Math.floor(width / Math.max(1, size * .56)));
    const sourceLines = String(layer.text || '').split('\n');
    const visualLines = sourceLines.reduce((total, line) => total + Math.max(1, Math.ceil(line.length / charactersPerLine)), 0);
    return Math.max(size * 1.08, visualLines * size * lineHeight) + 6;
  }

  function layerHeight(layer) {
    if (layer.type === 'text') return textHeight(layer);
    if (Number.isFinite(+layer.h) && +layer.h > 0) return +layer.h;
    return Math.max(1, number(layer.w, 200) * Math.max(.01, number(layer.ar, 1)));
  }

  function bounds(layer) {
    const x = number(layer.x, 0), y = number(layer.y, 0);
    const w = Math.max(1, number(layer.w, 200)), h = layerHeight(layer);
    const radians = Math.abs(number(layer.rot, 0)) * Math.PI / 180;
    if (!radians) return {x, y, w, h, right:x + w, bottom:y + h};
    const rotatedW = Math.abs(w * Math.cos(radians)) + Math.abs(h * Math.sin(radians));
    const rotatedH = Math.abs(w * Math.sin(radians)) + Math.abs(h * Math.cos(radians));
    const rotatedX = x - (rotatedW - w) / 2;
    const rotatedY = y - (rotatedH - h) / 2;
    return {x:rotatedX, y:rotatedY, w:rotatedW, h:rotatedH, right:rotatedX + rotatedW, bottom:rotatedY + rotatedH};
  }

  function isFullCanvas(layer, rawFormat) {
    const f = format(rawFormat), box = bounds(layer);
    return /^(svgraw|img|shot)$/.test(layer.type || '') && Math.abs(number(layer.x, 0)) <= 3 && Math.abs(number(layer.y, 0)) <= 3 &&
      number(layer.w, 0) >= f.w * .94 && box.h >= f.h * .90;
  }

  function scaleLayer(layer, scale, offsetX, offsetY) {
    const next = Object.assign({}, layer);
    const originalWidth = Math.max(1, number(layer.w, 200));
    const originalHeight = layerHeight(layer);
    next.x = round(offsetX + number(layer.x, 0) * scale);
    next.y = round(offsetY + number(layer.y, 0) * scale);
    next.w = round(Math.max(24, originalWidth * scale));
    if (layer.type === 'text') next.size = round(Math.max(12, number(layer.size, 60) * scale));
    else if (next.w > originalWidth * scale + .01) next.ar = round((originalHeight * scale) / next.w);
    return next;
  }

  function fitLayerInside(layer, rawFormat, padding) {
    const f = format(rawFormat), inset = Math.max(0, number(padding, 0));
    const next = Object.assign({}, layer);
    if (isFullCanvas(next, f)) {
      next.x = 0; next.y = 0; next.w = f.w; next.ar = f.h / f.w;
      return next;
    }

    next.x = number(next.x, 0); next.y = number(next.y, 0);
    next.w = Math.max(24, number(next.w, 200));
    if (next.type === 'text') next.size = Math.max(12, number(next.size, 60));

    let box = bounds(next);
    const availableW = Math.max(24, f.w - inset * 2), availableH = Math.max(24, f.h - inset * 2);
    const fitScale = Math.min(1, availableW / Math.max(1, box.w), availableH / Math.max(1, box.h));
    if (fitScale < 1) {
      const previousHeight=layerHeight(next),desiredWidth=next.w*fitScale;
      next.w = Math.max(24, desiredWidth);
      if (next.type === 'text') next.size = Math.max(12, next.size * fitScale);
      else if(next.w>desiredWidth+.01) next.ar=(previousHeight*fitScale)/next.w;
      box = bounds(next);
    }

    if (box.x < inset) next.x += inset - box.x;
    if (box.right > f.w - inset) next.x -= box.right - (f.w - inset);
    if (box.y < inset) next.y += inset - box.y;
    if (box.bottom > f.h - inset) next.y -= box.bottom - (f.h - inset);
    next.x = round(next.x); next.y = round(next.y); next.w = round(next.w);
    if (next.type === 'text') next.size = round(next.size);
    return next;
  }

  function normalizeComposition(layers, rawFormat, options) {
    const opts = options || {}, f = format(rawFormat);
    return (Array.isArray(layers) ? layers : []).map(layer => fitLayerInside(layer, f, opts.padding || 0));
  }

  function reflowComposition(layers, rawFrom, rawTo, options) {
    const from = format(rawFrom), to = format(rawTo), opts = options || {};
    const scale = Math.min(to.w / Math.max(1, from.w), to.h / Math.max(1, from.h));
    const offsetX = (to.w - from.w * scale) / 2;
    const offsetY = (to.h - from.h * scale) / 2;
    const transformed = (Array.isArray(layers) ? layers : []).map(layer => {
      if (isFullCanvas(layer, from)) {
        const background = Object.assign({}, layer, {x:0, y:0, w:to.w, ar:to.h / to.w});
        return background;
      }
      return scaleLayer(layer, scale, offsetX, offsetY);
    });
    return normalizeComposition(transformed, to, opts);
  }

  function auditComposition(layers, rawFormat, options) {
    const f = format(rawFormat), tolerance = number(options && options.tolerance, 1.5);
    const errors = [];
    (Array.isArray(layers) ? layers : []).forEach((layer, index) => {
      const numeric = ['x','y','w'].concat(layer.type === 'text' ? ['size'] : []);
      numeric.forEach(key => {
        if (!Number.isFinite(+layer[key])) errors.push({index, code:'non-finite-'+key});
      });
      const box = bounds(layer);
      if (box.x < -tolerance || box.y < -tolerance || box.right > f.w + tolerance || box.bottom > f.h + tolerance) {
        errors.push({index, code:'out-of-bounds', box:{x:round(box.x),y:round(box.y),right:round(box.right),bottom:round(box.bottom)}, format:f.id});
      }
    });
    return {ok:errors.length === 0, errors, format:f, layers:Array.isArray(layers) ? layers.length : 0};
  }

  root.CMVNG_BUILDER_GEOMETRY_V6 = {
    version:'6.0.0', FORMATS, format, bounds, layerHeight, isFullCanvas,
    normalizeComposition, reflowComposition, auditComposition
  };
})(typeof window !== 'undefined' ? window : globalThis);

  function hydrateTemplatePreview(host, templateId, customValues) {
    if (!host || !T[templateId]) return;
    const values = customValues || Object.assign({}, clone(T[templateId].sample || {}), {branding:true});
    host.innerHTML = T[templateId].render(values);
    host.style.width = '1080px';
    host.style.height = '1350px';
    host.style.transformOrigin = '0 0';
    host.style.pointerEvents = 'none';
    const resize = () => {
      const shell = host.parentElement;
      const width = shell && shell.clientWidth;
      if (width) host.style.transform = 'scale(' + (width / 1080) + ')';
    };
    resize();
    requestAnimationFrame(() => {
      try { fitPass(host); } catch (_) {}
      resize();
    });
    if (window.ResizeObserver && !host.__bwResize) {
      host.__bwResize = new ResizeObserver(resize);
      host.__bwResize.observe(host.parentElement);
    }
  }

  function normaliseProjectSource(raw) {
    const value = String(raw || '').trim();
    if (!value) return {url:'', warning:''};
    try {
      const url = new URL(/^https?:\/\//i.test(value) ? value : 'https://' + value);
      const host = url.hostname.toLowerCase().replace(/^www\./, '');
      if (/(^|\.)(x\.com|twitter\.com)$/.test(host)) {
        const handle = url.pathname.split('/').filter(Boolean)[0] || '';
        if (!handle || /^(home|explore|search|i|settings)$/i.test(handle)) {
          return {url:'', warning:'That is only the X homepage. Paste the project’s exact profile, website, docs, or a specific post.'};
        }
      }
      return {url:url.href, warning:''};
    } catch (_) {
      return {url:'', warning:'That source does not look complete. Use the official website, docs, or exact X profile.'};
    }
  }

  function briefEvidence(brief) {
    brief = brief || {};
    const numbers = Object.keys(brief.live_numbers || {}).filter(key => !/no token|not found|unknown/i.test(String(brief.live_numbers[key])));
    const news = (brief.news_feed || []).filter(Boolean);
    const pulse = (brief.x_pulse || []).filter(Boolean);
    const pages = (brief.pages_read || []).filter(Boolean);
    const verified = (brief.verified_facts || []).filter(item => item && item.value);
    const excerpts = (brief.source_excerpt || []).filter(Boolean);
    const sources = (brief.sources || []).filter(item => item && item.url);
    const one = String(brief.one_liner || '').trim();
    return {numbers,news,pulse,pages,verified,excerpts,sources,one,
      count:numbers.length + news.length + pulse.length + pages.length + verified.length + excerpts.length + (one ? 1 : 0)};
  }

  function renderResearchBrief(project, brief) {

    const verifiedHTML = evidence.verified.slice(0, 4).map(item => '<div class="bw-f"><b>' + escEnh(item.label || 'verified') + '</b>' + escEnh(String(item.value).slice(0, 150)) + '</div>').join('');
    const sourcePills = [
      evidence.one ? '<div class="bw-f"><b>official description</b>found</div>' : '',
      evidence.excerpts.length ? '<div class="bw-f"><b>source content</b>' + evidence.excerpts.length + ' excerpt' + (evidence.excerpts.length === 1 ? '' : 's') + ' read</div>' : '',
      evidence.pages.length ? '<div class="bw-f"><b>official pages</b>' + evidence.pages.length + ' read</div>' : '',
      evidence.pulse.length ? '<div class="bw-f"><b>X signals</b>' + evidence.pulse.length + ' found</div>' : '',
      evidence.news.length ? '<div class="bw-f"><b>updates</b>' + evidence.news.length + ' found</div>' : ''
    ].join('');
    if (evidence.count && brief.writing_ready !== false) {
      facts.innerHTML = '<div class="bw-research-ready"><b>' + escEnh(project) + ' research brief ready ✓</b><span>' + evidence.count +
        ' verified signal' + (evidence.count === 1 ? '' : 's') + ' will guide the writing and design match.</span></div><div class="bw-facts">' + numberHTML + verifiedHTML + sourcePills + '</div>' +
        (evidence.sources.length ? '<div class="bw-mut" style="margin-top:7px"><b>sources:</b> ' + evidence.sources.slice(0,3).map(item => escEnh(item.kind || 'source')).join(' · ') + '</div>' : '');
      setWriterFlow(1);
    } else {
      facts.innerHTML = '<div class="bw-warn"><b>I found the project name, but not enough verifiable material yet.</b><br><br>' +
        'Paste the official website, docs, exact X profile/post, or attach screenshots. The app will not spend a writing call on invented facts.</div>';
    }

  function firstPastedURL() {
    const ids = ['bw_root','bw_proj','bw_topic'];
    for (const id of ids) {
      const node = document.getElementById(id);
      const match = String(node && node.value || '').match(/(?:https?:\/\/[^\s<>"']+|(?:www\.)?[a-z0-9][a-z0-9.-]+\.[a-z]{2,}(?:\/[^\s<>"']*)?)/i);
      if (match) {
        const value=match[0].replace(/[),.;!?]+$/, '');
        return /^https?:\/\//i.test(value) ? value : 'https://' + value;
      }
    }
    return '';
  }

  function projectFromURL(raw) {
    try {
      const url = new URL(raw);
      const host = url.hostname.toLowerCase().replace(/^www\./, '');
      const parts = url.pathname.split('/').filter(Boolean);
      if (/(^|\.)(x\.com|twitter\.com)$/.test(host) && parts[0]) return '@' + parts[0];
      return host.split('.')[0].replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    } catch (_) { return 'linked project'; }
  }

  async function smartResearchProject(force) {
    const projectInput = document.getElementById('bw_proj');
    const rootInput = document.getElementById('bw_root');
    const facts = document.getElementById('bw_facts');
    const pastedURL = firstPastedURL();
    let project = String(projectInput && projectInput.value || '').trim();
    if (/^https?:\/\//i.test(project)) {
      if (rootInput && !rootInput.value.trim()) rootInput.value = project;
      project = projectFromURL(project);
      if (projectInput) projectInput.value = project;
    }
    if (!project && pastedURL) {
      project = projectFromURL(pastedURL);
      if (projectInput) projectInput.value = project;
    }
    if (!project) {
      if (facts) facts.innerHTML = '<div class="bw-warn">Enter a project name or paste an exact website, article, docs, or X-post link.</div>';
      return false;
    }
    if (rootInput && !rootInput.value.trim() && pastedURL) rootInput.value = pastedURL;
    const source = normaliseProjectSource(rootInput && rootInput.value);
    const helper = document.querySelector('.bw-source-help');
    if (helper) {
      helper.textContent = source.warning;
      helper.classList.toggle('on', !!source.warning);
    }
    const key = project.toLowerCase() + '|' + source.url.toLowerCase();
    if (!force && window.__bwHasBrief && window.__bwBriefKey === key && briefEvidence(window.__bwBrief).count) return true;
    if (facts) facts.innerHTML = '<div class="bw-research-progress">researching ' + escEnh(project) +
      '… checking the official source, product details, live numbers and current signals before writing.</div>';
    setWriterFlow(0);
    try {
      // The native writer captures this session at page load. Prefer that same
      // sessionStorage value, then mirror it to localStorage for refresh recovery.
      let session = '';
      try {
        session = sessionStorage.getItem('banger_session') || localStorage.getItem('banger_session') || '';
        if (session) {
          sessionStorage.setItem('banger_session', session);
          localStorage.setItem('banger_session', session);
        }
      } catch (_) {}
      const response = await fetch('/gather', {method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({proj:project,root:source.url,session})});
      const result = await response.json();
      const brief = result.brief || {};
      window.__bwBrief = brief;
      window.__bwBriefKey = key;
      window.__bwBriefProject = project;
      window.__bwHasBrief = response.ok && brief.writing_ready !== false && briefEvidence(brief).count > 0;
      renderResearchBrief(project, brief);
      return window.__bwHasBrief;
    } catch (_) {
      window.__bwHasBrief = false;
      if (facts) facts.innerHTML = '<div class="bw-warn">Research could not finish. Check the project link or attach screenshots, then try again.</div>';
      return false;
    }
  }

  function installSmartWriteHandoff() {
    const project = document.getElementById('bw_proj');
    const root = document.getElementById('bw_root');
    const gather = document.getElementById('bw_gather');
    const write = document.getElementById('bw_go');

      helper.classList.toggle('on', !!source.warning);

      if (!projectName && pastedURL) {
        projectName = projectFromURL(pastedURL);
        project.value = projectName;
        if (!root.value.trim()) root.value = pastedURL;
      }
      write.dataset.busy = '1';
      write.disabled = true;
      const old = write.textContent;
      try {
        if (projectName) {
          write.textContent = 'researching before writing…';
          const researched = await smartResearchProject(false);
          // A URL is not factual material. In particular, an X status ID must
          // never unlock the paid writer after research fails.
          const factText = originalTopic
            .replace(/(?:https?:\/\/[^\s<>"']+|(?:www\.)?[a-z0-9][a-z0-9.-]+\.[a-z]{2,}(?:\/[^\s<>"']*)?)/ig, ' ')
            .replace(/\s+/g, ' ').trim();
          const labeledMetric = /\b(?:tvl|revenue|users?|customers?|volume|funding|raised|price|market\s*cap|transactions?|downloads?|launched?|founded|release(?:d)?|date)\b[^.\n]{0,70}\$?\d[\d,.]*(?:\s?[kmbt%])?/i.test(factText);
          const factLines = originalTopic.split(/\n+/).map(line => line.replace(/https?:\/\/\S+/ig, '').trim())
            .filter(line => line.length > 18 && /[A-Za-z]/.test(line) && /\d/.test(line));
          const detailedInput = factText.length > 180 || labeledMetric || factLines.length >= 2;
          if (!researched && !hasScreens && !detailedInput) return;
          if (topic) {
            const source = normaliseProjectSource(root.value).url;
            topic.value = 'Project: ' + projectName + '\n' + (source ? 'Official source: ' + source + '\n' : '') +
              'Requested angle: ' + (originalTopic || 'general project overview');

        }
        write.textContent = 'writing in your voice…';
        const running = nativeWrite && nativeWrite.call(write, event);
        if (topic) topic.value = originalTopic;
        await running;
      } finally {
        if (topic) topic.value = originalTopic;
        write.dataset.busy = '0';
        write.disabled = false;
        write.textContent = old;

    };

  function listSpec(label) {
    const max = parseInt(((label || '').match(/×\s*(\d+)/) || [])[1] || (/\b(\d+)\s+(?:items|steps|rows|nodes|cells|branches|flags|beats|rules)/i.exec(label || '') || [])[1] || '6', 10);
    const before = String(label || '').replace(/×\s*\d+.*/i, '').replace(/comma.*/i, '').trim();
    const colonPart = before.match(/(?:rows?|items?|steps?|tiles?|milestones?|rungs?|nodes?|bubbles?|dots?|months?|weeks?|fields?|findings?|posts?|holdings?|offers?|parts?|skills?)\s+(.+)$/i);
    const heads = colonPart && colonPart[1].includes(':') ? colonPart[1].split(':').map(x => x.trim()) : [];
    return {max: Math.max(1, Math.min(max, 12)), heads};
  }

  function cleanCell(value) {
    return String(value || '')
      .replace(/:/g, '：')
      .replace(/,/g, (m, index, all) => /\d/.test(all[index - 1] || '') && /\d/.test(all[index + 1] || '') ? ',' : '，')
      .trim();
  }

  function splitColumns(row, count, heads) {
    if (count <= 1) return [row];
    const parts = String(row || '').split(':');
    if (parts.length <= count) return parts.concat(Array(count - parts.length).fill(''));
    if (count === 2 && /time/i.test(heads[0] || '')) {
      return [parts.slice(0, -1).join(':'), parts[parts.length - 1]];
    }
    return parts.slice(0, count - 1).concat(parts.slice(count - 1).join(':'));
  }

  function enhanceSimpleField(field, slot) {
    const input = field.querySelector('input[type="text"]');
    if (!input || field.querySelector('.bw-field-meta')) return;
    const current = String(vals[slot.id] || '');
    const long = current.length > 58 || /body|copy|caption|description|note|subline|headline|quote|thread|hook|explain|take/i.test(slot.label || '');
    let control = input;
    if (long) {
      const textarea = document.createElement('textarea');
      textarea.className = 'bw-field';
      textarea.value = current;
      textarea.setAttribute('aria-label', slot.label || slot.id);
      input.replaceWith(textarea);
      control = textarea;
    }
    const meta = document.createElement('div');
    meta.className = 'bw-field-meta';
    meta.innerHTML = '<span>live preview</span><span class="bw-count">' + current.length + ' chars</span>';
    field.appendChild(meta);
    control.oninput = event => {
      setV(slot.id, event.target.value);
      const counter = meta.querySelector('.bw-count');
      if (counter) counter.textContent = event.target.value.length + ' chars';
    };
  }

  function enhanceListField(field, slot) {
    const spec = listSpec(slot.label || '');
    const sourceRows = parseList(vals[slot.id], spec.max);
    const rows = sourceRows.length ? sourceRows.slice() : [''];
    const cols = Math.max(1, spec.heads.length);
    const label = field.querySelector('label');
    field.innerHTML = '';
    if (label) field.appendChild(label);
    const help = document.createElement('div');
    help.className = 'bw-list-help';
    help.textContent = cols > 1 ? 'each row is editable · the columns match the design' : 'one item per row · drag-free, comma-safe editing';
    field.appendChild(help);
    const body = document.createElement('div');
    field.appendChild(body);

    function pack() {
      const value = rows.filter(row => row.some ? row.some(x => String(x).trim()) : String(row).trim())
        .map(row => Array.isArray(row) ? row.map(cleanCell).join(':') : cleanCell(row))
        .join(', ');
      setV(slot.id, value);
    }

    let dataRows = rows.map(row => splitColumns(row, cols, spec.heads));
    function renderRows() {
      body.innerHTML = '';
      if (cols > 1) {
        const head = document.createElement('div');
        head.className = 'bw-list-head';
        head.style.gridTemplateColumns = 'repeat(' + cols + ',minmax(0,1fr))';
        head.innerHTML = spec.heads.map(x => '<span>' + escEnh(x) + '</span>').join('');
        body.appendChild(head);
      }
      dataRows.forEach((row, ri) => {
        const line = document.createElement('div');
        line.className = 'bw-list-row';
        line.style.gridTemplateColumns = 'repeat(' + cols + ',minmax(0,1fr)) 28px';
        for (let ci = 0; ci < cols; ci++) {
          const input = document.createElement('input');
          input.className = 'bw-list-input';
          input.value = row[ci] || '';
          input.placeholder = spec.heads[ci] || ('item ' + (ri + 1));
          input.oninput = event => {
            dataRows[ri][ci] = event.target.value;
            rows.splice(0, rows.length, ...dataRows);
            pack();
          };
          line.appendChild(input);
        }
        const remove = document.createElement('button');
        remove.className = 'bw-list-remove';
        remove.type = 'button';
        remove.textContent = '×';
        remove.setAttribute('aria-label', 'Remove row ' + (ri + 1));
        remove.onclick = () => {
          dataRows.splice(ri, 1);
          if (!dataRows.length) dataRows.push(Array(cols).fill(''));
          rows.splice(0, rows.length, ...dataRows);
          pack();
          renderRows();
        };
        line.appendChild(remove);
        body.appendChild(line);
      });
      if (dataRows.length < spec.max) {
        const add = document.createElement('button');
        add.type = 'button';
        add.className = 'bw-list-add';
        add.textContent = '+ add row';

  const DESIGN_RULES = [
    {re:/\b(top\s*\d+|rank|leaderboard|best\s+\d|podium)\b/i, ids:['orbit10','leadboard','top5','podium']},
    {re:/\b(vs\.?|versus|compare|against|better than|difference)\b/i, ids:['versus','compare3','feecompare','thisorthat']},
    {re:/\b(how to|steps?|guide|checklist|do this|tutorial|airdrop|farm)\b/i, ids:['steps','stack','preflight','dyor']},
    {re:/\b(timeline|history|roadmap|unlock|vesting|deadline|countdown|launch date)\b/i, ids:['timeline','vesting','countdown','betimeline']},
    {re:/[$#]?\d[\d,.]*\s*(?:%|x|m|b|k|million|billion)?|\b(volume|tvl|users|revenue|stat|data)\b/i, ids:['bignum','tiles','bars','recap','area']},
    {re:/\b(news|breaking|announce|announcing|launch|live now|update|shipped|release)\b/i, ids:['news','announce','changelog','milestone']},
    {re:/\b(price|market|trade|trading|whale|bull|bear|funding|flow|apy|yield)\b/i, ids:['pnl','whale','gasline','feargreed','flow2']},
    {re:/\b(ecosystem|network|map|architecture|agents?|nodes?|projects?)\b/i, ids:['ecosystem','network','mindmap','stack']},
    {re:/\b(quote|said|take|opinion|believe|think|truth)\b/i, ids:['quote','minimal','sticker','hotcold']},
    {re:/\b(thread|deep dive|research|explainer|breakdown)\b/i, ids:['threadcover','threadmap','setcover','eli5']},
    {re:/\b(myth|wrong|misconception|fact check)\b/i, ids:['mythfact','redflags','greenflag']},
    {re:/\b(poll|vote|community|sentiment)\b/i, ids:['pollcard','votes','vibecheck','feargreed']}
  ];

  function draftContext(version) {
    const project = (document.getElementById('bw_proj') || {}).value || '';
    const source = version && (version.source || '') || '';
    const brief = window.__bwBrief || {};
    return [project, version && version.lens, version && version.draft, source,
      JSON.stringify(brief.live_numbers || {}), JSON.stringify(brief.news_feed || [])].join(' ');
  }

  function hasImagesAvailable() {
    const brief = window.__bwBrief || {};
    return !!((window.__bwShots || []).length || (brief.assets_for_design || []).length);
  }

  function designChoices(version) {
    const context = draftContext(version);
    const low = context.toLowerCase();
    const tokens = Array.from(new Set(low.match(/[a-z0-9$%]{4,}/g) || [])).slice(0, 90);
    const scores = {};
    Object.keys(T).forEach(id => {
      const template = T[id];
      const hay = (id + ' ' + template.name + ' ' + template.cat + ' ' + (template.tags || '')).toLowerCase();
      let score = 0;
      tokens.forEach(token => { if (hay.includes(token)) score += 0.7; });
      if (id === (version && version.template)) score += 3;
      if (hasImagesAvailable() && (template.slots || []).some(slot => slot.t === 'images')) score += 2.5;
      if (template.cat === 'my world' && !/limitless|wallchain|elsa|naira|lagos|nigeria|quacks|cmvng/.test(low)) score -= 12;
      scores[id] = score;
    });
    DESIGN_RULES.forEach(rule => {
      if (!rule.re.test(context)) return;
      rule.ids.forEach((id, index) => { if (T[id]) scores[id] = (scores[id] || 0) + 12 - index * 1.4; });
    });
    if (!Object.keys(scores).some(id => scores[id] > 4)) {
      ['quote','minimal','threadcover'].forEach((id, index) => { if (T[id]) scores[id] = 8 - index; });
    }
    return Object.keys(scores).sort((a, b) => scores[b] - scores[a]).slice(0, 4);
  }

  function templateMatchReason(version, id, index) {
    const context = draftContext(version);
    const template = T[id] || {};
    const label = (id + ' ' + (template.name || '') + ' ' + (template.tags || '')).toLowerCase();
    if (/top\s*\d+|rank|leaderboard|podium/i.test(context) || /top|rank|leader|podium/.test(label)) {
      return 'turns the ranking into a clear visual hierarchy';
    }
    if (/\b(vs\.?|versus|compare|against|difference)\b/i.test(context) || /versus|compare|this or that/.test(label)) {
      return 'makes the comparison instantly scannable';
    }
    if (/\b(how to|steps?|guide|checklist|tutorial)\b/i.test(context) || /steps|checklist|guide/.test(label)) {
      return 'maps the story into a simple sequence';
    }
    if (/\b(timeline|history|roadmap|unlock|vesting|deadline|launch date)\b/i.test(context) || /timeline|countdown|vesting/.test(label)) {
      return 'shows the timing and sequence at a glance';
    }
    if (/[$#]?\d[\d,.]*\s*(?:%|x|m|b|k|million|billion)?|\b(volume|tvl|users|revenue|stat|data)\b/i.test(context) || /number|stat|data|tile|bar/.test(label)) {
      return 'makes the strongest verified number the hero';
    }
    if (/\b(news|breaking|announce|launch|update|release|shipped)\b/i.test(context) || /news|announce|launch|update/.test(label)) {
      return 'gives the update a sharp editorial feel';
    }
    if (hasImagesAvailable() && (template.slots || []).some(slot => slot.t === 'images')) {
      return 'uses your screenshots as visible proof';
    }
    if (/\b(thread|deep dive|research|explainer|breakdown)\b/i.test(context) || /thread|cover|explainer/.test(label)) {
      return 'frames the research as a strong visual story';
    }
    return index === 0 ? 'strongest editorial fit for this angle' : 'a distinct alternative direction for the same story';
  }

  function designRecommendations(version) {
    return designChoices(version).map((id, index) => ({
      id,
      score: Math.max(78, 96 - index * 6),
      reason: templateMatchReason(version, id, index)
    }));
  }

  function contextParts(version) {
    const brief = window.__bwBrief || {};
    const draft = String(version.draft || '');
    const lines = draft.split(/\n+/).map(x => x.replace(/^[-•\d.)\s]+/, '').trim()).filter(Boolean);
    const live = Object.keys(brief.live_numbers || {}).map(key => key + ': ' + brief.live_numbers[key]);
    const news = (brief.news_feed || []).map(x => typeof x === 'string' ? x : (x.title || x.text || ''));
    const facts = live.concat(news, lines.slice(1)).filter(Boolean);
    const numbers = (draftContext(version).match(/[$#₦]?\d[\d,.]*\s*(?:[%xXMBK]|million|billion)?\+?/g) || [])
      .map(x => x.trim()).filter(x => x.length > 1);
    return {
      headline: (lines[0] || ((document.getElementById('bw_proj') || {}).value + ' update') || 'the story').slice(0, 92),
      secondary: (lines[1] || facts[0] || version.lens || 'the part worth watching').slice(0, 150),
      lines,

      numbers

  function buildListValue(slot, parts) {
    const spec = listSpec(slot.label || '');
    const cols = Math.max(1, spec.heads.length);
    const material = (parts.facts.length ? parts.facts : parts.lines).slice(0, spec.max);
    while (material.length < Math.min(spec.max, 3)) material.push(parts.secondary);
    return material.slice(0, spec.max).map((fact, index) => {
      const phrase = String(fact || parts.secondary).replace(/[,]/g, '，').replace(/:/g, '：').slice(0, 72);
      if (cols === 1) return phrase;
      return spec.heads.map((head, ci) => {
        const key = head.toLowerCase();
        if (/rank|no\.?|#/.test(key)) return String(index + 1);
        if (/done|pass|good|check/.test(key)) return '1';
        if (/pct|percent/.test(key)) return (parts.numbers[index] || (72 - index * 9) + '%').replace(/:/g, '：');
        if (/value|number|stat|price|pts|score|pool|rate|size|n$|Δ/i.test(head)) return (parts.numbers[index] || parts.numbers[0] || String((index + 1) * 10)).replace(/:/g, '：');
        if (/sub|note|body|what|task|label/.test(key) && ci > 0) return (parts.facts[index + 1] || parts.secondary).replace(/[,]/g, '，').replace(/:/g, '：').slice(0, 62);
        if (/time|date|day|month|q$/.test(key)) return index === 0 ? 'now' : 'next';
        return phrase;
      }).join(':');
    }).join(', ');
  }

  function smartTemplateValues(templateId, version) {
    const template = T[templateId];
    const next = clone(template.sample || {});
    const parts = contextParts(version);
    const project = ((document.getElementById('bw_proj') || {}).value || '').trim();
    const logoKey = projectLogoKey();
    const images = imageSources();
    let textCursor = 0;
    (template.slots || []).forEach(slot => {
      if (!slot) return;
      const key = (slot.id + ' ' + (slot.label || '')).toLowerCase();
      if (slot.t === 'logo') {
        next[slot.id] = logoKey;
      } else if (slot.t === 'images') {
        next[slot.id] = images.slice(0, slot.max || 4);
      } else if (slot.t === 'pfpform') {
        next.pfp = next.pfp || 'cut';
      } else if (slot.t === 'text') {
        if (/×\s*\d|comma/i.test(slot.label || '')) {
          next[slot.id] = buildListValue(slot, parts);
        } else if (/accent/.test(key)) {
          next[slot.id] = (project || parts.headline.split(/\s+/).slice(-2).join(' ')).slice(0, 28);
        } else if (/big number|big stat|\bnumber\b|\bstat\b|\bpct\b|\bscore\b|\bprice\b|\bvalue\b|\bn\b/.test(key)) {
          next[slot.id] = parts.numbers[textCursor++ % Math.max(parts.numbers.length, 1)] || '01';
        } else if (/title|headline|\bhead\b|\bhook\b|\bmarket\b|\bquestion\b|\bq\b|line 1|main/.test(key)) {
          next[slot.id] = parts.headline;
        } else if (/brand name|project/.test(key) && project) {
          next[slot.id] = project;
        } else if (/who|author|handle|source/.test(key)) {
          next[slot.id] = key.includes('source') ? (project || 'project research') : 'cmvng';
        } else if (/sub|note|caption|body|what|foot|line 2|line 3|thesis/.test(key)) {
          next[slot.id] = (parts.lines[textCursor++ % Math.max(parts.lines.length, 1)] || parts.secondary).slice(0, 150);
        } else {
          next[slot.id] = (parts.lines[textCursor++ % Math.max(parts.lines.length, 1)] || parts.secondary).slice(0, 110);
        }
      }
    });
    if (templateId === version.template && version.slots && typeof version.slots === 'object') {
      Object.keys(version.slots).forEach(key => {
        if ((template.slots || []).some(slot => slot.id === key)) next[key] = version.slots[key];
      });
    }
    next.branding = true;
    next.brandmode = next.brandmode || 'chip';
    next.skin = next.skin || 'detailed';
    next.format = next.format || 'post';
    next.tone = next.tone || 'classic';
    if (next.decor === undefined) next.decor = true;
    return next;
  }

  function normalizeHandoff(items, frame) {
    const W = Math.max(320, +(frame && frame.W) || 1080);
    const H = Math.max(320, +(frame && frame.H) || 1350);
    const seenText = [];
    return (Array.isArray(items) ? items : []).reduce((clean, source) => {
      if (!source || !source.type) return clean;
      const item = Object.assign({}, source);
      const rawWidth = Number(item.w);
      const rawX = Number(item.x);
      const rawY = Number(item.y);
      if (![rawWidth, rawX, rawY].every(Number.isFinite)) return clean;
      item.w = Math.round(Math.max(24, Math.min(W * 1.15, rawWidth)));
      const estimatedHeight = item.type === 'text'
        ? Math.max(24, (+item.size || 42) * (+item.lh || 1.15) * Math.max(1, String(item.text || '').split('\n').length))
        : Math.max(24, item.w * (+item.ar || .72));
      item.x = Math.round(Math.max(-item.w * .08, Math.min(W - item.w * .12, rawX)));
      item.y = Math.round(Math.max(-estimatedHeight * .08, Math.min(H - estimatedHeight * .12, rawY)));
      if (item.type === 'text') {
        item.text = String(item.text || '').replace(/\u00a0/g, ' ').trim();
        if (!item.text) return clean;
        const signature = item.text.toLowerCase().replace(/\s+/g, ' ');
        const duplicate = seenText.some(prior => prior.signature === signature && Math.abs(prior.x - item.x) < 24 && Math.abs(prior.y - item.y) < 24);
        if (duplicate) return clean;
        seenText.push({signature, x:item.x, y:item.y});
      }
      clean.push(item);
      return clean;
    }, []).slice(0, 47);
  }

  function isFoundationItem(item) {
    return !!item && ((foundationBuilderId && item.__id === foundationBuilderId) || (foundationSrc && item.src === foundationSrc));

  function applyFoundationLock() {
    if (!foundationSrc || !window.__bapi) return;

    const index = state.data.findIndex(isFoundationItem);

    const node = foundationBuilderId && document.getElementById('bdel' + foundationBuilderId);
    if (node) {

  /* ---------- Builder inspector, layers, shapes, and autosave ---------- */
  function builderState() {
    const list = window.__bapi.list();
    const data = window.__bapi.serialize();
    data.forEach((item, index) => {
      item.__id = list[index] && list[index].id;
      if ((item.type === 'shot' || item.type === 'img') && !item.ar && list[index]) {
        item.ar = list[index].h / Math.max(1, list[index].w);
      }
    });
    return {list, data, format:window.__bapi.fmt()[0], background:document.getElementById('bd_canvas').style.background || ''};
  }

  function importBuilderState(data, format, background, selectedIndex) {
    const geometry=builderGeometryV6();
    const bounded=geometry?geometry.normalizeComposition(data,format||window.__bapi.fmt()[0],{padding:0}):data;
    const clean = bounded.map(item => {
      const next = Object.assign({}, item);
      delete next.__id;
      return next;
    });
    suppressBuilderSave = true;
    window.__bapi.importEls(clean, format || window.__bapi.fmt()[0], background || '');
    suppressBuilderSave = false;
    const nextList = window.__bapi.list();
    const foundationIndex = clean.findIndex(item => foundationSrc && item.src === foundationSrc);
    foundationBuilderId = foundationIndex >= 0 && nextList[foundationIndex] ? nextList[foundationIndex].id : null;
    if (typeof selectedIndex === 'number' && nextList[selectedIndex]) {
      selectedBuilderId = nextList[selectedIndex].id;
      window.__bapi.select(selectedBuilderId);
    } else {
      selectedBuilderId = null;
    }
    requestAnimationFrame(applyFoundationLock);
    scheduleBuilderSave();
  }

  function selectedIndex(state) {
    return state.list.findIndex(item => item.id === selectedBuilderId);
  }

  function mutateSelected(mutator, keepIndex) {
    const state = builderState();
    const index = selectedIndex(state);
    if (index < 0) {
      toast('select a layer on the canvas first', 'warn');
      return;
    }
    if (foundationLocked && isFoundationItem(state.data[index])) {
      toast('the design foundation is locked · unlock it in Layers if you really need to move it', 'warn');
      return;
    }
    mutator(state.data, index, state);
    const target = keepIndex == null ? Math.min(index, state.data.length - 1) : keepIndex;
    importBuilderState(state.data, state.format, state.background, target);
    renderBuilderSheet();
  }

  function rgbToHex(value) {
    if (/^#[0-9a-f]{6}$/i.test(value)) return value;

  function comparableComposition(layers) {
    const keys = ['type','x','y','w','rot','text','size','color','ff','fw','fst','lh','pre','src','ar','vb','inner','key','kind','form'];
    return JSON.stringify((layers || []).map(layer => {
      const next = {};
      keys.forEach(key => {
        if (layer[key] == null || layer[key] === '') return;
        next[key] = typeof layer[key] === 'number' ? Math.round(layer[key] * 1000) / 1000 : String(layer[key]);
      });
      if (next.rot == null) next.rot = 0;
      return next;
    }));
  }

  function compositionIsPristine(current) {
    return !!(originalBuilderDesign && activeCreativeDesignId &&
      comparableComposition(current) === comparableComposition(originalBuilderDesign.data));

  function buildV5Design(item,format) {
    const pack=creativePackV5(),t=activeCreativeTheme();
    if(!pack || !item) return [];
    let layers=[];
    if(item.kind==='layout') layers=pack.instantiate('layout',item.assetId,format,{theme:t}).concat(v5Signature(format[1],format[2],t));
    else if(item.kind==='type') layers=buildV5TypeDesign(item,format,t);

    else layers=buildV5DoodleDesign(item,format,t);
    return normalizeCreativeLayers(layers,format);
  }

  function v5Preview(layers,format) {
    const W=format[1],H=format[2];
    const nodes=layers.slice(0,18).map(item=>{
      const x=+item.x||0,y=+item.y||0,w=+item.w||W;
      if(item.type==='svgraw') return '<svg x="'+x+'" y="'+y+'" width="'+w+'" height="'+(w*(+item.ar||1))+'" viewBox="'+escEnh(item.vb||'0 0 100 100')+'" preserveAspectRatio="none">'+(item.inner||'')+'</svg>';
      if(item.type==='img') return '<image href="'+escEnh(item.src||'')+'" x="'+x+'" y="'+y+'" width="'+w+'" height="'+(w*(+item.ar||1))+'" preserveAspectRatio="xMidYMid slice"/>';
      if(item.type==='text') {
        const lines=String(item.text||'').split('\n'),size=+item.size||28,lh=size*(+item.lh||1.1),rot=+item.rot||0;
        return '<text x="'+x+'" y="'+(y+size)+'" fill="'+escEnh(item.color||'#101C33')+'" font-family="'+escEnh(item.ff||'Sora')+'" font-size="'+size+'" font-weight="'+escEnh(item.fw||'700')+'"'+(rot?' transform="rotate('+rot+' '+x+' '+y+')"':'')+'>'+lines.map((line,index)=>'<tspan x="'+x+'" dy="'+(index?lh:0)+'">'+escEnh(line)+'</tspan>').join('')+'</text>';
      }
      return '';
    }).join('');
    return '<svg class="bw-v5-art" viewBox="0 0 '+W+' '+H+'" aria-hidden="true">'+nodes+'</svg>';
  }

  function atomicAddV5(layers,description) {
    const state=builderState(),remaining=Math.max(0,48-state.data.length);
    if(!layers.length) return;
    if(layers.length>remaining) {
      toast(description+' needs '+layers.length+' layers; '+remaining+' are free. Delete layers or use Replace.','warn');
      return;
    }
    const drift=(state.data.length%4)*12, format=window.__bapi.fmt();
    const additions=normalizeCreativeLayers(layers.map(item=>Object.assign({},item,{x:(+item.x||0)+drift,y:(+item.y||0)+drift})),format);
    const next=state.data.concat(additions);
    importBuilderState(next,state.format,state.background,next.length-1);
    applyFoundationLock(); renderBuilderSheet();
    toast(description+' added · '+layers.length+' editable layers','ok');
  }

      const W=format[1],overlay=layers.filter(layer=>!(layer.type==='svgraw' && (+layer.x||0)===0 && (+layer.y||0)===0 && (+layer.w||0)>=W*.9));

    }
    foundationSrc=''; foundationBuilderId=null; foundationLocked=false;
    activeCreativeDesignId=item.id;
    originalBuilderDesign={data:clone(layers),format:format[0],background:'transparent',foundationSrc:'',creativeId:item.id,themeId:creativeV5Theme};

  function v5TabItems(tab) {
    const pack=creativePackV5(); if(!pack) return [];
    const catalog=pack.getCatalog();
    if(tab==='designs') return v5DesignCatalog();
    if(tab==='characters') return catalog.characters.map((item,index)=>Object.assign({},item,{kind:'character',index}));
    if(tab==='doodles') return catalog.doodles.map((item,index)=>Object.assign({},item,{kind:'doodle',index}));
    if(tab==='type') return catalog.textStructures.map((item,index)=>Object.assign({},item,{kind:'text',index}));
    return catalog.specialLayouts.map((item,index)=>Object.assign({},item,{kind:'layout',index}));

  function renderV5Filters(sheet,items) {
    const filters=sheet.querySelector('.bw-v5-filters');
    const categories=Array.from(new Set(items.map(item=>item.category).filter(Boolean))).slice(0,14);
    const values=['all','favorites','recent'].concat(categories);
    if(!values.includes(creativeV5Filter)) creativeV5Filter='all';
    filters.innerHTML=values.map(value=>'<button class="bw-v5-filter '+(value===creativeV5Filter?'on':'')+'" data-v5-filter="'+escEnh(value)+'">'+escEnh(value)+'</button>').join('');
    filters.querySelectorAll('[data-v5-filter]').forEach(button=>button.onclick=()=>{creativeV5Filter=button.dataset.v5Filter;creativeV5Limit=24;renderV5Catalog(sheet);});
  }

  function renderV5Catalog(sheet) {
    const pack=creativePackV5(); if(!pack) return;
    const items=v5TabItems(creativeV5Tab),query=(sheet.querySelector('#bw_v5_search').value||'').trim().toLowerCase();
    renderV5Filters(sheet,items);
    const favorites=v5FavoriteIds(),recent=v5RecentIds();
    let matches=items.filter(item=>{
      const identifier=creativeV5Tab==='designs'?item.id:(item.kind+'-'+item.id);
      if(creativeV5Filter==='favorites'&&!favorites.includes(identifier)) return false;
      if(creativeV5Filter==='recent'&&!recent.includes(identifier)) return false;
      if(!/^(all|favorites|recent)$/.test(creativeV5Filter)&&item.category!==creativeV5Filter) return false;
      const hay=[item.name,item.note,item.category].concat(item.tags||[]).join(' ').toLowerCase();
      return !query||hay.includes(query);
    });
    if(creativeV5Filter==='recent') matches.sort((a,b)=>recent.indexOf(creativeV5Tab==='designs'?a.id:(a.kind+'-'+a.id))-recent.indexOf(creativeV5Tab==='designs'?b.id:(b.kind+'-'+b.id)));
    sheet.querySelector('#bw_v5_count').textContent=matches.length+' found';
    const format=['preview',1080,1080],visible=matches.slice(0,creativeV5Limit);
    const cards=visible.map(item=>{
      const identifier=creativeV5Tab==='designs'?item.id:(item.kind+'-'+item.id);
      let layers=[];
      if(creativeV5Tab==='designs') layers=buildV5Design(item,format); else layers=pack.instantiate(item.kind,item.id,format,{theme:activeCreativeTheme()});
      return '<article class="bw-v5-card"><button class="bw-v5-fave '+(favorites.includes(identifier)?'on':'')+'" data-v5-fave="'+escEnh(identifier)+'" aria-label="favorite">★</button><button class="bw-v5-use" data-v5-use="'+escEnh(item.id)+'"><div class="bw-v5-preview">'+v5Preview(layers,format)+'</div><div class="bw-v5-meta"><b>'+escEnh(item.name)+'</b><span>'+escEnh(item.note||'Editable native CMVNG system.')+'</span><i>'+(creativeV5Tab==='designs'?'use complete design':'add editable layers')+' · '+layers.length+' layers →</i></div></button></article>';
    }).join('');
    sheet.querySelector('#bw_v5_grid').innerHTML=cards+(matches.length>visible.length?'<button class="bw-v5-more" data-v5-more>show '+Math.min(24,matches.length-visible.length)+' more →</button>':'')+(!matches.length?'<div class="bw-v5-empty">No systems match that search yet.</div>':'');
    sheet.querySelectorAll('[data-v5-use]').forEach(button=>button.onclick=()=>{const item=items.find(entry=>entry.id===button.dataset.v5Use);if(!item)return;if(creativeV5Tab==='designs')useV5Design(item);else useV5Asset(item.kind,item);renderV5Catalog(sheet);});
    sheet.querySelectorAll('[data-v5-fave]').forEach(button=>button.onclick=event=>{event.stopPropagation();toggleV5Favorite(button.dataset.v5Fave);renderV5Catalog(sheet);});
    const more=sheet.querySelector('[data-v5-more]'); if(more) more.onclick=()=>{creativeV5Limit+=24;renderV5Catalog(sheet);};
  }
