<script>
(function(){
  const $ = id => document.getElementById(id);
  let brief = null;
  const NL = String.fromCharCode(10);

  function panelHTML(){
    return '<div class="bf-wrap">'
     +'<div class="bf-card"><div class="bf-lab">project</div>'
     +'<input id="bf_proj" class="bf-in" placeholder="MegaETH" value="MegaETH">'
     +'<div class="bf-lab">project link</div>'
     +'<input id="bf_root" class="bf-in" placeholder="https://www.megaeth.com" value="https://www.megaeth.com">'
     +'<button id="bf_gather" class="bf-btn">1 · gather (free)</button></div>'
     +'<div id="bf_dossier"></div></div>';
  }
  function styles(){
    if($('bf_style'))return;
    const s=document.createElement('style'); s.id='bf_style';
    s.textContent='.bf-wrap{padding:4px 2px 40px}'
    +'.bf-card{background:#0F1A30;border:1px solid #22314F;border-radius:16px;padding:16px;margin-bottom:14px}'
    +'.bf-lab{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#7E93C4;margin:4px 0 6px}'
    +'.bf-in{width:100%;background:#0A1424;border:1px solid #26365A;border-radius:10px;color:#EAF2FF;padding:12px;font-size:15px;margin-bottom:12px}'
    +'.bf-btn{width:100%;background:#2E6BFF;color:#fff;border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:800}'
    +'.bf-facts{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}'
    +'.bf-f{background:#0A1424;border:1px solid #26365A;border-radius:9px;padding:7px 10px;font-size:12px}'
    +'.bf-f b{display:block;font-size:9px;color:#7E93C4;text-transform:uppercase;letter-spacing:.1em}'
    +'.bf-sec{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#5D7BB8;margin:16px 0 8px}'
    +'.bf-n{font-size:12px;color:#C7D6F0;padding:5px 0;border-bottom:1px solid #16223E}'
    +'.bf-ok{color:#7CE0A0;font-size:13px;margin-bottom:4px}'
    +'.bf-draft{background:#0A1424;border:1px solid #26365A;border-radius:12px;padding:13px;margin-bottom:11px;white-space:pre-wrap;font-size:13.5px;line-height:1.5;color:#EAF2FF}'
    +'.bf-tags{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}'
    +'.bf-tag{background:#16295A;color:#9FC0FF;border-radius:99px;padding:3px 10px;font-size:11px}'
    +'.bf-use{background:#1D5DF2;color:#fff;border:0;border-radius:99px;padding:6px 14px;font-size:12px;font-weight:800}'
    +'.bf-warn{background:#3A1220;border:1px solid #7A2340;color:#FFB4C4;border-radius:12px;padding:12px;font-size:13px}'
    +'.bf-mut{font-size:11px;color:#8CA3CC;margin-top:6px}';
    document.head.appendChild(s);
  }
  function E(x){return (window.esc?esc(x):String(x==null?'':x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])));}

  async function gather(){
    const proj=$('bf_proj').value, root=$('bf_root').value;
    $('bf_dossier').innerHTML='<div class="bf-card">gathering… opening the site, pulling numbers, reading X…</div>';
    try{
      const r=await fetch('/gather',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({proj:proj,root:root})});
      const j=await r.json(); brief=j.brief; renderDossier(j.brief);
    }catch(e){ $('bf_dossier').innerHTML='<div class="bf-card"><div class="bf-warn">could not gather. try again.</div></div>'; }
  }
  function renderDossier(b){
    const facts=Object.keys(b.live_numbers||{}).map(k=>'<div class="bf-f"><b>'+E(k)+'</b>'+E(b.live_numbers[k])+'</div>').join('')||'—';
    const news=(b.news_feed||[]).map(x=>'<div class="bf-n">'+E(x)+'</div>').join('')||'—';
    const xp=(b.x_pulse||[]).map(p=>'<div class="bf-n">'+E(p.src)+' · '+E(p.text)+'</div>').join('')||'—';
    $('bf_dossier').innerHTML='<div class="bf-card"><div class="bf-ok">✓ boss done · cost so far $0.00</div>'
      +'<div class="bf-sec">live numbers</div><div class="bf-facts">'+facts+'</div>'
      +'<div class="bf-sec">news</div>'+news
      +'<div class="bf-sec">x pulse</div>'+xp+'</div>'
      +'<div class="bf-card"><div class="bf-lab">2 · your angle</div>'
      +'<textarea id="bf_angle" class="bf-in" style="min-height:64px" placeholder="push the ecosystem apps, skip price, honest but bullish"></textarea>'
      +'<button id="bf_write" class="bf-btn">3 · write it (fires api · cents)</button>'
      +'<div class="bf-mut">the api only runs on this button. nothing runs on a timer.</div></div>'
      +'<div id="bf_out"></div>';
    $('bf_write').onclick=write;
  }
  async function write(){
    const angle=$('bf_angle').value;
    $('bf_out').innerHTML='<div class="bf-card">writing… one small api call on the gathered brief…</div>';
    try{
      const r=await fetch('/write',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({angle:angle,th:2,po:4,qt:4})});
      const j=await r.json(); renderDrafts(j);
    }catch(e){ $('bf_out').innerHTML='<div class="bf-card"><div class="bf-warn">write failed. try again.</div></div>'; }
  }
  function renderDrafts(res){
    if(res.error){ $('bf_out').innerHTML='<div class="bf-card"><div class="bf-warn">'+E(res.error)+'<br><br>'+E(res.message||'')+'</div></div>'; return; }
    const d=res.drafts||{}; let out='<div class="bf-card"><div class="bf-ok">✓ drafts ready · run $'+E(res.run_cost_usd)+' · month $'+E(res.month_spent_usd)+'</div></div>';
    const groups=[['threads','THREADS'],['posts','POSTS'],['qts','QUOTE-TWEETS']];
    let idx=0; window.__bfDrafts={};
    groups.forEach(function(gp){
      const items=d[gp[0]]||[]; if(!items.length)return;
      out+='<div class="bf-sec">'+gp[1]+'</div>';
      items.forEach(function(it){
        const id='d'+(idx++); window.__bfDrafts[id]=it;
        const img=it.image?'<span class="bf-tag">img: '+E(it.image)+'</span>':'';
        out+='<div class="bf-draft">'+E(it.draft||'')
          +'<div class="bf-tags"><span class="bf-tag">design: '+E(it.template||'—')+'</span>'+img
          +'<button class="bf-use" onclick="__bfUse(\''+id+'\')">use in a template ↗</button></div></div>';
      });
    });
    $('bf_out').innerHTML=out;
  }
  window.__bfUse=function(id){
    const it=(window.__bfDrafts||{})[id]; if(!it)return;
    const tpl=(it.template&&T[it.template])?it.template:'minimal';
    openT(tpl);
    // bring the canvas forward: leave the writer screen + its body mode
    var ws=$('wscr'); if(ws)ws.classList.remove('on');
    document.body.classList.remove('bmode');
    document.querySelectorAll('.screen').forEach(function(x){x.classList.remove('on');});
    var ed=$('editor'); if(ed)ed.classList.add('on');
    const parts=(it.draft||'').split(NL); let line='';
    for(let i=0;i<parts.length;i++){ if(parts[i].trim()){line=parts[i].trim();break;} }
    const slots=T[tpl].slots.filter(function(s){return s.t==='text';}).map(function(s){return s.id;});
    const prefs=['head','t','l1','big','q','title','headline'];
    let pref=null;
    for(let i=0;i<prefs.length;i++){ if(slots.indexOf(prefs[i])>=0){pref=prefs[i];break;} }
    if(!pref)pref=slots[0];
    if(pref)setV(pref,line.slice(0,90));
    window.scrollTo(0,0);
  };
  function mountIntoWriter(){
    const ws=$('wscr'); if(!ws)return;
    const body=ws.querySelector('.wbody'); if(!body||body.dataset.bf)return;
    styles(); body.dataset.bf='1'; body.innerHTML=panelHTML();
    $('bf_gather').onclick=gather;
  }
  if(typeof window.goWriter==='function'){
    const orig=window.goWriter;
    window.goWriter=function(){ orig(); setTimeout(mountIntoWriter,30); };
  }
  document.addEventListener('DOMContentLoaded',function(){ setTimeout(function(){ if($('wscr')&&$('wscr').classList.contains('on'))mountIntoWriter(); },200); });
})();
</script>
